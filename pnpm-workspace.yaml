patchedDependencies:
  "@base-ui/react@1.6.0": packages/extensions/components/patches/@base-ui__react@1.6.0.patch

overrides:
  react: 19.2.8
  react-dom: 19.2.8
  # Pin @base-ui/react to the version the patch is keyed to. The consumers
  # (core, ui) depend on `^1.4.1`, and newer releases (1.6.0+) exist, so a
  # fresh resolve without a lockfile floats past 1.5.0 and leaves
  # patches/@base-ui__react@1.5.0.patch unused (ERR_PNPM_UNUSED_PATCH).
  # The patch fixes the Puck/base-ui getModifierState crash, so keep it
  # applied by pinning the single resolved version here.
  "@base-ui/react": 1.6.0
  # Pin a single typedoc + typescript pair so typedoc-plugin-markdown's
  # `instanceof Reflection` check works — otherwise pnpm installs a
  # separate `typedoc` copy per consuming `typescript` peer version and
  # the plugin sees two different `Reflection` class instances at
  # render time and bails with "The page model should be a reflection
  # when rendering the 'reflection' page kind."
  typedoc: 0.28.19
  # Carve-outs from the `typescript: 7.0.2` pin below for madge's dependency
  # chain, which requires the JS-based compiler API (`ts.Extension`,
  # `ts.createCompilerHost`, ...) that the native tsgo typescript@7 no longer
  # exposes — under 7.0.2 it crashes at require time ("Cannot read properties
  # of undefined (reading 'Cjs')"), breaking every package `check:circular`
  # and the root `pnpm madge` CI gate. 6.0.3 is the `@typescript/old` JS
  # compiler that typescript@7.0.2 itself depends on, so no new compiler
  # version enters the graph. Two pnpm 11 gotchas encoded here:
  # (1) scoped `parent>child` overrides only beat a bare override for REGULAR
  #     dependencies, and only when listed BEFORE it (first match wins) — so
  #     keep these above the bare `typescript:` pin;
  # (2) they never win for PEER dependencies, so .pnpmfile.cjs converts the
  #     typescript peer of detective-typescript and typescript-estree into a
  #     regular dependency first. filing-cabinet already has a regular
  #     typescript dependency, so it only needs the override.
  "detective-typescript>typescript": 6.0.3
  "@typescript-eslint/typescript-estree>typescript": 6.0.3
  "filing-cabinet>typescript": 6.0.3
  # typedoc (api-snapshot gates + docs generators) is the same old-API story:
  # its peer range stops at 6.0.x and it crashes at import under 7.0.2
  # ("reading 'PropertyDeclaration'"). Keyed to 6.0.3 it remains the single
  # typedoc + typescript pair the pin above exists to guarantee.
  "typedoc>typescript": 6.0.3
  # Every Next app verifies TypeScript by probing typescript/lib/typescript.js
  # — a file the native tsgo typescript@7 no longer ships (its lib/ holds only
  # tsc.js, getExePath.js, version.cjs). Next therefore reports `typescript` as
  # a MISSING dependency even though it is right there in devDependencies, and
  # what happens next depends on the environment:
  #   - locally (`isCI` false) Next shells out to `pnpm add -D typescript`,
  #     which is a ~2 min no-op because the request is already satisfied, so
  #     the build limps on and the breakage stays invisible;
  #   - in CI (`isCI` true) Next skips the auto-install by design and throws
  #     FatalError E552 from `missingDepsError` instead, so `next build` exits
  #     nonzero right after "Skipping validation of types" — with the message
  #     swallowed, because it is raised inside the build worker.
  # That is why this bites BOTH bundlers: playground (`--webpack`) and studio
  # (`--turbopack`) run the same `verifyAndRunTypeScript` probe. It is also not
  # fixable via next.config.js — `typescript.ignoreBuildErrors` skips the type
  # CHECK, not this dependency verification. Key both app importers to the
  # 6.0.3 JS compiler so Next's verification resolves and `tsc --noEmit` works.
  "playground>typescript": 6.0.3
  "studio>typescript": 6.0.3
  typescript: 7.0.2
