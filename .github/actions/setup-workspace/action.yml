name: Setup pnpm workspace
description: >-
  Set up pnpm + Node.js and install the root workspace, whose lockfile also
  locks packages/extensions/components and its leaves. Assumes the
  repository is already checked out with submodules — a local composite
  action can only run after checkout, so the checkout step stays in each job.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 12.3.4
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    # The root pnpm-lock.yaml is the only lock: the root workspace includes
    # packages/extensions/components and every component leaf (src/*), and the
    # components repository has carried no lockfile since its commit 2cf30d4. A
    # nested `pnpm --dir packages/extensions/components install` therefore cannot
    # run frozen (ERR_PNPM_FROZEN_LOCKFILE_WITH_OUTDATED_LOCKFILE, every CI run
    # since 2026-09-24) and must not run at all: it would put the shared members
    # (runtime/ui, analytics/*, tooling/configs/*, the leaves) on a second store
    # with a duplicate React and an unpatched @base-ui/react. The nested
    # pnpm-workspace.yaml sets verifyDepsBeforeRun: false, so turbo's builds
    # inside a leaf never auto-install either.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Fail fast if the duplicate-React landmine ever returns (e.g. a step
    # installs the nested components workspace again):
    # shared workspace members must resolve react from the ROOT store, never
    # from the components workspace store.
    - name: Verify single React instance
      shell: bash
      run: |
        for pkg in packages/runtime/ui packages/capabilities/analytics/react; do
          link="$pkg/node_modules/react"
          target="$(readlink -f "$link")"
          case "$target" in
            */packages/extensions/components/node_modules/*)
              echo "::error::$link resolves into the components workspace store ($target)." \
                "This creates a second physical React copy and an unpatched @base-ui/react," \
                "crashing every root-workspace test that renders @anvilkit/ui." \
                "Only the root 'pnpm install' may install the workspace; never install packages/extensions/components on its own."
              exit 1
              ;;
          esac
        done
        echo "OK: shared workspace members resolve react from the root store."
