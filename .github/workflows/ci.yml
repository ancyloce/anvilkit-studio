name: CI

# Phase 5 (restructure plan §16/§19): the former single monolithic job is
# split so npm release gates and app/deploy gates are separate, path-aware
# checks:
#
#   changes        — classifies the PR diff (dorny/paths-filter).
#   validate       — lint + typecheck + madge + test + build for the whole
#                    workspace. Always runs: this is the full blocking gate
#                    the migration plan keeps in place during the
#                    restructure.
#   package-gates  — publint + per-package `check:all` release gates + size
#                    budgets. npm release concerns; skipped only when every
#                    changed file lives under `apps/`. Apps are
#                    dependency-graph leaves — no package depends on an app,
#                    so an app-only diff cannot affect a package gate.
#   studio-e2e /   — per-app Playwright suites (+ the docs build). Each runs
#   playground-e2e   when the app itself changed or when anything outside
#   / docs           `apps/` changed — a package change can affect every
#                    app, so the conservative full cone applies.
#
# Skipping is deliberately coarse: finer per-package cones stay off until
# dependency boundaries are machine-enforced (plan §15/§19 —
# dependency-cruiser is still deferred). Jobs are skipped via job-level
# `if:` rather than `on.paths` so branch-protection required checks report
# "skipped" (which satisfies protection) instead of hanging as "expected".

on:
  pull_request:
  workflow_dispatch:
    inputs:
      capture_perf_baseline:
        description: >-
          Capture a §28 performance baseline on this runner instead of
          gating against the committed one. Download the
          `editor-perf-baseline` artifact and commit it to
          packages/runtime/core/bench/baselines/editor-perf.json.
        type: boolean
        default: false
      e2e_matrix:
        description: >-
          Run the full §27.5 browser matrix (Chromium + Chromium HiDPI +
          Firefox + WebKit) in the studio E2E job. Always on for
          workflow_dispatch and scheduled runs; off for pull requests so
          PR feedback stays fast.
        type: boolean
        default: true
      capture_visual_baselines:
        description: >-
          Regenerate the editor visual-regression baselines on this
          runner instead of asserting against the committed ones.
          Download the `editor-visual-baselines` artifact and commit it
          to apps/studio/e2e/editor/visual-regression.spec.ts-snapshots/.
        type: boolean
        default: false

  # §27.5 requires the editor specs to certify on three engines, which is
  # too slow for every PR. Nightly gives Firefox/WebKit a scheduled home
  # with visible results, while PRs keep the Chromium fast path.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      non_app: ${{ steps.filter.outputs.non_app }}
      studio: ${{ steps.filter.outputs.studio }}
      playground: ${{ steps.filter.outputs.playground }}
      docs: ${{ steps.filter.outputs.docs }}
      canvas: ${{ steps.filter.outputs.canvas }}
    steps:
      # pull_request events are classified via the GitHub API — no checkout
      # needed. On workflow_dispatch this step is skipped and every output
      # is empty, which the job conditions below treat as "run everything".
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # Any changed file OUTSIDE apps/ ⇒ run the full dependent cone.
            # Belt-and-braces patterns: `!(apps)/**` catches every current
            # and future top-level directory except apps/, and the
            # root-file/dotfile patterns catch lockfile, workspace, and
            # config changes. A future new top-level directory therefore
            # fails safe (runs everything) instead of skipping gates.
            non_app:
              - "!(apps)/**"
              - "*"
              - ".*"
              - ".*/**"
            studio:
              - "apps/studio/**"
            playground:
              - "apps/playground/**"
            docs:
              - "apps/docs/**"
            # Plan 0022 T-M0-01: the two Auto Layout packages. Both are git
            # submodules, so a change here also shows up as a gitlink bump
            # under `packages/**` (and therefore in `non_app`) — this filter
            # exists to scope the per-package `verify` job, not to replace
            # the workspace-wide gates.
            canvas:
              - "packages/capabilities/canvas/**"

  validate:
    name: Lint, Typecheck, and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Lint workspace
        run: pnpm lint

      - name: Puck import contract (public surface + single resolution)
        run: pnpm check:puck-imports

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Madge — detect circular dependencies
        run: pnpm madge

      - name: Test workspace
        run: pnpm test

      - name: Build workspace
        run: pnpm build

  package-gates:
    name: Package release gates
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.non_app == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      # Retained-submodule contract (plan §16 Phase 5, §19): gitlink
      # pointer bumps land as `packages/**` changes, so they route into
      # this job — validate the pinned submodule state against
      # scripts/submodule-contract.json before running its gates.
      - name: Validate retained-submodule contracts
        run: node scripts/check-submodule-contracts.mjs

      # `check:all` and the size budgets inspect `dist/`, so build first.
      - name: Build workspace
        run: pnpm build

      - name: Publint — validate package.json exports
        run: pnpm publint

      # Phase 5: release gates are discovered from workspace manifests, not
      # a hardcoded package list (plan §20). The root `check:all` script
      # fans out via `turbo run check:all --concurrency=4` to every
      # workspace package that defines a `check:all` script (20 packages at
      # time of writing) — publint, circular-dep scan, React-free-runtime
      # assertions, peer-dep contracts, bundle budgets, and TypeDoc API
      # snapshots, per package. A newly added publishable package is gated
      # automatically the moment it ships a `check:all` script. Concurrency
      # stays at 4 — higher fan-out is a known source of phantom
      # bundle-budget failures.
      - name: Run package release gates (check:all)
        run: pnpm check:all

      # Phase 4 (`phase4-016`): per-package gzip budgets via size-limit.
      # Covers the publishable runtime + plugin + component packages.
      # I2-6 added the canvas packages (canvas-core, canvas-editor,
      # plugin-ai-image, plugin-canvas-studio); I2-3 added plugin-export-canvas.
      # Each package ships its own `.size-limit.json` with a tuned budget.
      # Every component `.size-limit.json` carries TWO entries — the JS
      # `dist/index.js` budget and a `dist/styles.css` gzip budget (12 KB) —
      # so this one step gates both. The CSS budget guards against a component
      # re-importing `@anvilkit/tailwind-config/shadcn` (the app-level sheet),
      # which would re-emit preflight + the workspace utility superset (~24 KB)
      # into the package; `/component` is the per-component, preflight-free entry.
      # The filter list stays explicit (rather than `turbo run size`
      # discovery) so budget coverage changes remain deliberate, reviewed
      # decisions.
      - name: Bundle-size budgets (size-limit)
        run: |
          pnpm \
            --filter @anvilkit/utils \
            --filter @anvilkit/contracts \
            --filter @anvilkit/ir \
            --filter @anvilkit/schema \
            --filter @anvilkit/validator \
            --filter @anvilkit/ui \
            --filter @anvilkit/core \
            --filter @anvilkit/plugin-export-html \
            --filter @anvilkit/plugin-export-react \
            --filter @anvilkit/plugin-ai-copilot \
            --filter @anvilkit/plugin-asset-manager \
            --filter @anvilkit/plugin-design-system \
            --filter @anvilkit/plugin-page-seo \
            --filter @anvilkit/analytics-core \
            --filter @anvilkit/analytics-react \
            --filter @anvilkit/canvas-core \
            --filter @anvilkit/canvas-editor \
            --filter @anvilkit/plugin-ai-image \
            --filter @anvilkit/plugin-canvas-studio \
            --filter @anvilkit/plugin-export-canvas \
            --filter @anvilkit/bento-grid \
            --filter @anvilkit/blog-list \
            --filter @anvilkit/button \
            --filter @anvilkit/design-block \
            --filter @anvilkit/helps \
            --filter @anvilkit/hero \
            --filter @anvilkit/input \
            --filter @anvilkit/logo-clouds \
            --filter @anvilkit/navbar \
            --filter @anvilkit/pricing-minimal \
            --filter @anvilkit/section \
            --filter @anvilkit/statistics \
            size

  canvas-verify:
    name: Canvas packages — verify
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.canvas == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      # Plan 0022 T-M0-01: one entry point per canvas package, composing
      # lint → typecheck → test-with-coverage → build → check:all in
      # dependency order (`check:all` inspects `dist/`, so `build` precedes
      # it). The workspace-wide `validate` and `package-gates` jobs still
      # run every one of those gates for every package; what `verify` adds
      # is the COVERAGE thresholds, which the workspace `pnpm test` does not
      # enforce — `canvas-core` has had them since PRD 0012 and
      # `canvas-editor` gained a baseline in T-M0-08.
      #
      # Split per package so a failure names which one, and so canvas-core
      # still reports when canvas-editor fails.
      - name: Verify @anvilkit/canvas-core
        run: pnpm --filter @anvilkit/canvas-core verify

      - name: Verify @anvilkit/canvas-editor
        run: pnpm --filter @anvilkit/canvas-editor verify

  # Plan 0022 T-M5-04: the Auto Layout resolver benchmark (PRD §13.1 cold
  # ≤50 ms / warm ≤16 ms). Its own job for the same reason as editor-perf:
  # latency must not share a runner with the build/test fan-out.
  #
  # ENFORCEMENT STATUS (deliberate, documented): the harness gates only on
  # the recorded reference environment (bench/REFERENCE-ENVIRONMENT.md — an
  # exact-fingerprint match, where the PRD budgets are falsifiable). On
  # this runner the fingerprint does not match, so the run REPORTS the
  # figures and prints "gating: DISABLED" — visible in the log, never a
  # silent green (the harness asserts a stated reason). To turn this job
  # into a hard gate: nominate a CI hardware class in
  # `REFERENCE_ENVIRONMENT` (see REFERENCE-ENVIRONMENT.md "Changing the
  # reference machine") and set ANVILKIT_CANVAS_BENCH_REQUIRE_GATING=1
  # below — with the flag, a run that cannot gate FAILS instead of
  # reporting (the REVIEW-0019 §2 P1 anti-pattern guard).
  canvas-bench:
    name: Canvas layout resolver benchmark (PRD §13.1)
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.canvas == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Run layout resolver benchmark
        run: pnpm --filter @anvilkit/canvas-core bench:layout | tee canvas-bench-report.txt

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-bench-report
          path: canvas-bench-report.txt
          if-no-files-found: ignore

  # PLAN-0020 CORE-P4-001: the DD-0019 §28 performance gate. Runs the
  # editor harness (fixed 1k/10k fixtures, 20-run median + p95) and fails
  # on an absolute-budget violation or a >10% regression against the
  # stored baseline.
  #
  # Its own job on purpose: latency measurement must not share a runner
  # with the build/test fan-out, whose CPU contention is exactly the noise
  # the harness would otherwise record as a regression.
  #
  # `ANVILKIT_BENCH_HW` pins the reference class. Regression comparison
  # only gates when the committed baseline carries the SAME class (plan
  # §14) — comparing this runner against a WSL2 laptop capture would
  # produce noise, not signal.
  #
  # `ANVILKIT_BENCH_REQUIRE_BASELINE: "1"` makes "could not compare" a
  # FAILURE rather than a console note (REVIEW-0019 §2 P1: the gate
  # reported green while its regression half never ran). Consequence, by
  # design: this job fails until a `ci-ubuntu-latest-x64` baseline is
  # committed.
  #
  # To capture that baseline: run this workflow via **workflow_dispatch**
  # with `capture_perf_baseline: true`, download the
  # `editor-perf-baseline` artifact, and commit it to
  # `packages/runtime/core/bench/baselines/editor-perf.json`. The
  # baselines directory is tracked; only `bench/results/` is gitignored.
  # Never commit a baseline captured anywhere else — a laptop capture
  # carries `local-*` and would be ignored by the class check anyway.
  editor-perf:
    name: Editor performance budgets (§28)
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.non_app == 'true'
    defaults:
      run:
        shell: bash
    env:
      ANVILKIT_BENCH_HW: ci-ubuntu-latest-x64
      ANVILKIT_BENCH_REQUIRE_BASELINE: "1"
      ANVILKIT_BENCH_UPDATE_BASELINE: ${{ inputs.capture_perf_baseline && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      # Run through turbo so `^build` supplies the workspace dependencies
      # the harness resolves at runtime (`@anvilkit/contracts` et al.);
      # Core's own `src/` is imported directly by Vitest, unbuilt.
      - name: Run editor performance harness
        run: pnpm turbo run bench:editor --filter @anvilkit/core

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-perf-results
          path: packages/runtime/core/bench/results/editor-perf.json
          if-no-files-found: warn

      # Only produced in capture mode. `if-no-files-found: error` so a
      # capture run that silently wrote nothing fails instead of handing
      # back an empty artifact.
      - name: Upload captured performance baseline
        if: always() && inputs.capture_perf_baseline
        uses: actions/upload-artifact@v4
        with:
          name: editor-perf-baseline
          path: packages/runtime/core/bench/baselines/editor-perf.json
          if-no-files-found: error

  # Phase 3 M0 (`phase3-001`): Playwright + studio E2E harness. The smoke
  # spec loads `/puck/editor`, waits for `<Studio>` to hydrate, and asserts
  # `smokeTestPlugin.onInit` logs to the browser console. The studio
  # Playwright config boots its own `pnpm dev` server; `turbo run e2e`
  # builds the studio's workspace dependencies first (`e2e` dependsOn
  # `^build`).
  #
  # §27.5 browser matrix (CORE-P1B-012): `ANVILKIT_E2E_MATRIX=1` adds the
  # `firefox` and `webkit` Playwright projects (editor specs only). It is
  # ON for scheduled and dispatched runs and OFF for pull requests — the
  # split the plan asks for: fast Chromium feedback per PR, three-engine
  # certification nightly. Before this, the variable was set nowhere in
  # `.github/`, so Firefox and WebKit had never executed in CI at all.
  studio-e2e:
    name: Studio E2E
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.non_app == 'true' || needs.changes.outputs.studio == 'true'
    defaults:
      run:
        shell: bash
    env:
      ANVILKIT_E2E_MATRIX: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.e2e_matrix)) && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      # `install --with-deps chromium` downloads Chromium + the OS
      # libraries Playwright needs on Ubuntu runners. Locally, developers
      # run `pnpm --filter studio e2e:install` once.
      - name: Install Playwright browsers
        if: env.ANVILKIT_E2E_MATRIX != '1'
        run: pnpm --filter studio e2e:install

      # Matrix runs need the Firefox and WebKit builds plus their system
      # libraries (WebKit's gstreamer/libwoff set is not part of the
      # Chromium dependency list), so the full `--with-deps` install
      # replaces the Chromium-only one rather than adding to it.
      - name: Install Playwright browsers (full §27.5 matrix)
        if: env.ANVILKIT_E2E_MATRIX == '1'
        run: pnpm --filter studio e2e:install:matrix

      - name: Run studio E2E tests
        run: pnpm exec turbo run e2e --filter=studio

      - name: Upload studio Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-studio
          path: apps/studio/playwright-report/
          retention-days: 7

  # Editor visual regression certification (PLAN-0020 CORE-P1A-007,
  # CORE-P2-009H). Its own job because its baselines are platform-bound:
  # the committed PNGs are produced by THIS runner image, and mixing them
  # into the general E2E job would tie every PR's result to font
  # rasterization.
  #
  # Not run on pull requests — nightly + dispatch only, matching the
  # browser matrix. On a missing baseline the job FAILS (Playwright's own
  # "snapshot doesn't exist" error); it never silently passes.
  #
  # To (re)generate baselines: dispatch this workflow with
  # `capture_visual_baselines: true`, download the
  # `editor-visual-baselines` artifact, and commit its contents to
  # `apps/studio/e2e/editor/visual-regression.spec.ts-snapshots/`.
  # Baselines from any other platform are not valid here.
  studio-e2e-visual:
    name: Editor visual regression
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        shell: bash
    env:
      ANVILKIT_E2E_VISUAL: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Playwright browsers
        run: pnpm --filter studio e2e:install

      # `turbo run e2e` first, so the app's workspace dependencies are
      # built (`e2e` dependsOn `^build`); the project filter keeps this to
      # the visual suite.
      - name: Assert against committed baselines
        if: ${{ !inputs.capture_visual_baselines }}
        run: pnpm exec turbo run e2e --filter=studio -- --project=editor-visual

      - name: Capture new baselines
        if: ${{ inputs.capture_visual_baselines }}
        run: pnpm exec turbo run e2e --filter=studio -- --project=editor-visual --update-snapshots

      - name: Upload captured baselines
        if: always() && inputs.capture_visual_baselines
        uses: actions/upload-artifact@v4
        with:
          name: editor-visual-baselines
          path: apps/studio/e2e/editor/visual-regression.spec.ts-snapshots/
          if-no-files-found: error

      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-studio-visual
          path: apps/studio/playwright-report/
          retention-days: 7

  # Phase 1 restructure: playground compatibility smoke. Minimal app
  # (apps/playground) that consumes @anvilkit/* strictly through built
  # public exports — mounts <Studio>, SSR-renders via @puckeditor/core/rsc.
  # Boots its own Next dev server on :3100 (studio owns :3000).
  playground-e2e:
    name: Playground E2E
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.non_app == 'true' || needs.changes.outputs.playground == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Playwright browsers
        run: pnpm --filter playground e2e:install

      - name: Run playground E2E tests
        run: pnpm exec turbo run e2e --filter=playground

      - name: Upload playground Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-playground
          path: apps/playground/playwright-report/
          retention-days: 7

  # Phase 4 (`phase4-001`): build the Fumadocs docs site (Vite / TanStack
  # Start) on every packages or docs PR. A broken docs build fails CI so
  # drifted component docs, sidebar entries, and ADR references can't land
  # unnoticed.
  #
  # Phase 4 (`phase4-005`): the build step is a **correctness** gate. The
  # **deploy** gate lives on Vercel (`vercel.json` at repo root) and posts
  # its own GitHub check with the preview URL. The Vercel check is
  # informational from CI's perspective — a failing Vercel build surfaces
  # in the PR UI but does not fail this workflow, and conversely a failing
  # CI build does not suppress the Vercel preview. The two builds are
  # intentionally independent so a regression in either surfaces before
  # merge.
  #
  # Phase 4 (`phase4-004`): docs site playground + marketplace smoke tests.
  # The specs boot the Vite dev server (TanStack Start), mount the Puck
  # `/playground`, and exercise the marketplace catalog.
  docs:
    name: Docs build + E2E
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.non_app == 'true' || needs.changes.outputs.docs == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Build docs site
        run: pnpm turbo run docs:build

      - name: Install Playwright browsers
        run: pnpm --filter @anvilkit/docs-site e2e:install

      - name: Run docs E2E tests
        run: pnpm exec turbo run e2e --filter=@anvilkit/docs-site

      - name: Upload docs Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-docs
          path: apps/docs/playwright-report/
          retention-days: 7
